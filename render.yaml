services:
  - type: web
    name: codesage
    env: node
    plan: free
    rootDir: client
    buildCommand: npm install --legacy-peer-deps && prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_ACCESS_TOKEN
        sync: false
      - key: ASSEMBLY_API_KEY
        sync: false
      - key: URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY
        sync: false
